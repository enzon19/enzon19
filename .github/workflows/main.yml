name: Update data from APIs

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

concurrency:
  group: update-data-gist-66e4659e3ddae3ea4428706f1d11100b
  cancel-in-progress: false

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Get data from last.fm (7 days)
        env:
          LASTFM_TOKEN: ${{ secrets.LASTFM_TOKEN }}
        run: |
          curl -sf "https://ws.audioscrobbler.com/2.0/?method=user.gettopalbums&user=enzon19&limit=3&period=7day&api_key=$LASTFM_TOKEN&format=json" -o 7days.json
          jq -e '.topalbums' 7days.json > /dev/null

      - name: Get data from last.fm (overall)
        env:
          LASTFM_TOKEN: ${{ secrets.LASTFM_TOKEN }}
        run: |
          curl -sf "https://ws.audioscrobbler.com/2.0/?method=user.gettopalbums&user=enzon19&limit=5&period=overall&api_key=$LASTFM_TOKEN&format=json" -o overall.json
          jq -e '.topalbums' overall.json > /dev/null

      - name: Get data from WeTrakr (last movie)
        env:
          WETRAKR_TOKEN: ${{ secrets.WETRAKR_TOKEN }}
        run: |
          curl -sf -L "https://api.wetrakr.com/users/3873/tracking/watched/movies?limit=1&extended=movie_level_1&sort_by=my_last_watched" -o last-movie.json \
            -H "wetrakr-api-key: $WETRAKR_TOKEN"
          jq -e '.[0].poster_path' last-movie.json > /dev/null

      - name: Get data from WeTrakr (last show)
        env:
          WETRAKR_TOKEN: ${{ secrets.WETRAKR_TOKEN }}
        run: |
          curl -sf -L "https://api.wetrakr.com/users/3873/tracking/watched/shows?limit=1&extended=show_level_1&sort_by=my_last_watched" -o last-show.json \
            -H "wetrakr-api-key: $WETRAKR_TOKEN"
          jq -e '.[0].poster_path' last-show.json > /dev/null

      - name: Get data from WeTrakr (current show)
        env:
          WETRAKR_TOKEN: ${{ secrets.WETRAKR_TOKEN }}
        run: |
          curl -sf -L "https://api.wetrakr.com/users/3873/tracking/watched/episodes?limit=1&extended=show_level_1&sort_by=my_last_watched" -o current-show.json \
            -H "wetrakr-api-key: $WETRAKR_TOKEN"
          jq -e '.[0].show.poster_path' current-show.json > /dev/null

      - name: Update Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 66e4659e3ddae3ea4428706f1d11100b
        run: |
          jq -n \
            --rawfile seven_days 7days.json \
            --rawfile overall overall.json \
            --rawfile last_movie last-movie.json \
            --rawfile last_show last-show.json \
            --rawfile current_show current-show.json \
            '{files: {
              "7days.json": {content: $seven_days},
              "overall.json": {content: $overall},
              "last-movie.json": {content: $last_movie},
              "last-show.json": {content: $last_show},
              "current-show.json": {content: $current_show}
            }}' > gist-update.json

          curl --silent --show-error --fail-with-body -X PATCH \
            -H "Authorization: token $GIST_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @gist-update.json \
            "https://api.github.com/gists/$GIST_ID"

<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Contato - enzon19</title>
		<meta name="title" content="Contato - enzon19" />

			name="description"
			content="Entre em contato com o Enzo: e-mail ou redes sociais." />

		<meta property="og:type" content="website" />
		<meta property="og:url" content="https://enzon19.com/contact" />
		<meta property="og:title" content="Contato - enzon19" />
		<meta
			property="og:description"
			content="Entre em contato com o Enzo: e-mail ou redes sociais." />
		<meta property="og:image" content="/assets/cover.png" />

		<meta property="twitter:card" content="summary_large_image" />
		<meta property="twitter:url" content="https://enzon19.com/contact" />
		<meta property="twitter:title" content="Contato - enzon19" />
		<meta
			property="twitter:description"
			content="Entre em contato com o Enzo: e-mail ou redes sociais." />
		<meta property="twitter:image" content="/assets/cover.png" />

		<link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/assets/favicon/apple-touch-icon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/favicon/favicon-32x32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/assets/favicon/favicon-16x16.png" />
		<link rel="manifest" href="/assets/favicon/site.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
			rel="stylesheet" />

		<link href="/css/animations.css" rel="stylesheet" />
		<link href="/css/style.css" rel="stylesheet" />

		<script
			type="module"
			src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
		<script
			nomodule
			defer
			src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
		<script src="/js/themes.js"></script>
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/gsap.min.js"></script>
		<script src="https://unpkg.com/lenis@1.3.26/dist/lenis.min.js"></script>
		<link
			rel="stylesheet"
			href="https://unpkg.com/lenis@1.3.26/dist/lenis.css" />
		<script
			defer
			src="https://cdn.jsdelivr.net/npm/gsap@3.15/dist/ScrollTrigger.min.js"></script>
		<script defer src="/js/animations/core.js"></script>

		<script type="module" src="/js/EnzoHeader.js"></script>
		<script type="module" src="/js/contact/render.js"></script>

		<script
			data-goatcounter="https://enzon19.goatcounter.com/count"
			async
			src="//gc.zgo.at/count.js"></script>
	</head>
	<body
		class="bg-neutral-100 text-neutral-700 selection:bg-enzo-sky selection:text-white dark:bg-neutral-900 dark:text-neutral-300">
		<enzo-header page="contact"></enzo-header>
		<main class="mx-auto max-w-6xl">
			<div
				class="-mt-22.5 flex min-h-dvh flex-col items-center justify-center p-4 py-0 sm:p-8 md:-mt-28.5 md:p-18 md:py-0">
				<div class="flex flex-col gap-6 md:gap-8">
					<p class="gsap-fly-up text-center">entre em contato por</p>
					<a
						href="mailto:contato@enzon19.com"
						class="gsap-fly-up text-center text-3xl font-semibold text-black sm:text-4xl dark:text-white"
						>contato@enzon19.com</a
					>
					<div
						class="gsap-fly-up flex w-full flex-row flex-wrap justify-center gap-3 md:gap-4">
						<a
							href="https://linkedin.com/in/enzon19"
							target="_blank"
							class="btn btn-md btn-secondary"
							style="animation-delay: 0.5s">
							<ion-icon name="logo-linkedin" class="text-xl"></ion-icon>
							<span>Linkedin</span>
						</a>
						<a
							href="https://github.com/enzon19"
							target="_blank"
							class="btn btn-md btn-secondary"
							style="animation-delay: 0.6s">
							<ion-icon name="logo-github" class="text-xl"></ion-icon>
							<span>GitHub</span>
						</a>
					</div>
				</div>
			</div>
		</main>
		<footer class="z-10 bg-neutral-200 p-6 dark:bg-neutral-800">
			<div
				class="mx-auto flex max-w-6xl flex-col gap-4 md:flex-row md:justify-between">
				<div class="flex flex-col gap-1">
					<h5 class="text-xl font-bold text-black dark:text-white">
						Enzo Neves Barata
					</h5>
					<p class="text-sm">2026. Desde 2021 criando para a web.</p>
					<p class="text-sm">
						Site feito com HTML, CSS (Tailwind) e JavaScript (Vanilla).
					</p>
				</div>
				<div
					class="flex flex-row items-center justify-between gap-3 md:justify-normal">
					<div class="flex items-center justify-between md:justify-normal">
						<div
							class="flex flex-row items-center gap-1 rounded-full bg-neutral-300 p-1 dark:bg-neutral-700">
							<a
								href="/v1"
								title="v1"
								class="flex cursor-pointer items-center justify-center rounded-full px-3 py-1.75 text-xs text-neutral-500 transition-colors hover:bg-white hover:text-neutral-800 dark:hover:bg-neutral-600 dark:hover:text-white">
								v1
							</a>

							<a
								href="/v2"
								title="v2"
								class="flex cursor-pointer items-center justify-center rounded-full px-3 py-1.75 text-xs text-neutral-500 transition-colors hover:bg-white hover:text-neutral-800 dark:hover:bg-neutral-600 dark:hover:text-white">
								v2
							</a>

							<a
								href="#"
								title="v3"
								aria-current="page"
								class="flex cursor-pointer items-center justify-center rounded-full bg-white px-3 py-1.75 text-xs text-neutral-800 transition-colors dark:bg-neutral-500/65 dark:text-white">
								v3
							</a>
						</div>
					</div>
					<div
						class="flex flex-row items-center gap-1 rounded-full bg-neutral-300 p-1 dark:bg-neutral-700">
						<input
							type="radio"
							name="theme"
							id="theme-system"
							value="system"
							class="peer/system sr-only" />
						<label
							for="theme-system"
							title="Sistema"
							class="flex cursor-pointer items-center justify-center rounded-full p-1.5 text-neutral-500 transition-colors peer-checked/system:bg-white peer-checked/system:text-neutral-800 hover:bg-white hover:text-neutral-800 peer-checked/system:hover:bg-white peer-checked/system:hover:text-neutral-800 dark:peer-checked/system:bg-neutral-500/65 dark:peer-checked/system:text-white dark:hover:bg-neutral-600 dark:hover:text-white dark:peer-checked/system:hover:bg-neutral-500/65 dark:peer-checked/system:hover:text-white">
							<ion-icon name="desktop" class="text-lg"></ion-icon>
						</label>

						<input
							type="radio"
							name="theme"
							id="theme-light"
							value="light"
							class="peer/light sr-only" />
						<label
							for="theme-light"
							title="Claro"
							class="flex cursor-pointer items-center justify-center rounded-full p-1.5 text-neutral-500 transition-colors peer-checked/light:bg-white peer-checked/light:text-neutral-800 hover:bg-white hover:text-neutral-800 peer-checked/light:hover:bg-white peer-checked/light:hover:text-neutral-800 dark:peer-checked/light:bg-neutral-500/65 dark:peer-checked/light:text-white dark:hover:bg-neutral-600 dark:hover:text-white dark:peer-checked/light:hover:bg-neutral-500/65 dark:peer-checked/light:hover:text-white">
							<ion-icon name="sunny" class="text-lg"></ion-icon>
						</label>

						<input
							type="radio"
							name="theme"
							id="theme-dark"
							value="dark"
							class="peer/dark sr-only" />
						<label
							for="theme-dark"
							title="Escuro"
							class="flex cursor-pointer items-center justify-center rounded-full p-1.5 text-neutral-500 transition-colors peer-checked/dark:bg-white peer-checked/dark:text-neutral-800 hover:bg-white hover:text-neutral-800 peer-checked/dark:hover:bg-white peer-checked/dark:hover:text-neutral-800 dark:peer-checked/dark:bg-neutral-500/65 dark:peer-checked/dark:text-white dark:hover:bg-neutral-600 dark:hover:text-white dark:peer-checked/dark:hover:bg-neutral-500/65 dark:peer-checked/dark:hover:text-white">
							<ion-icon name="moon" class="text-lg"></ion-icon>
						</label>
					</div>
				</div>
			</div>
		</footer>
	</body>
</html>

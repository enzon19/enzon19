<!doctype html>
<html lang="en" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title>Trakt Tools by enzon19</title>
		<meta name="title" content="Trakt Tools by enzon19" />
		<meta
			name="description"
			content="All Trakt Tools that I've done: RandomTV, ReverseTV and RebrandTV!" />

		<link
			rel="icon"
			type="image/x-icon"
			href="/v2/assets/favicon/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/v2/assets/favicon/apple-touch-icon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/v2/assets/favicon/favicon-32x32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/v2/assets/favicon/favicon-16x16.png" />
		<link rel="manifest" href="/v2/assets/favicon/site.webmanifest" />

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Varela&display=swap"
			rel="stylesheet" />
		<link href="/v2/css/main.css" rel="stylesheet" />
		<link href="/v2/css/styles.css" rel="stylesheet" />
	</head>
	<body
		class="flex min-h-screen flex-col items-center justify-center font-bold"
		style="font-family: 'Varela', sans-serif">
		<div class="flex flex-col items-center gap-1 text-center">
			<a
				href="https://enzon19.com"
				target="_blank"
				class="flex items-center gap-1">
				<img
					src="/v2/assets/face/complete_down.png"
					alt="enzon19"
					class="h-8" />
				<span class="text-lg text-neutral-600">enzon19's</span>
			</a>
			<h1 class="text-3xl text-neutral-800">Trakt Tools</h1>
		</div>
		<div class="flex w-full max-w-md flex-col gap-4 p-4">
			<a
				href="https://randomtv.enzon19.com/"
				target="_blank"
				class="block w-full cursor-pointer rounded-lg border border-neutral-400 bg-neutral-100 p-4 text-center text-neutral-700">
				<div class="flex flex-row items-center gap-4">
					<img
						src="/v2/assets/projects/trakt-tools/randomtv/logo.png"
						alt="Icons"
						class="h-14" />
					<div class="flex-col text-left">
						<h1 class="text-xl text-neutral-800">RandomTV</h1>
						<p>
							A browser extension to pick a random item from a list on Trakt.
						</p>
					</div>
				</div>
			</a>
			<a
				href="https://reversetv.enzon19.com/"
				target="_blank"
				class="block w-full cursor-pointer rounded-lg border border-neutral-400 bg-neutral-100 p-4 text-center text-neutral-700">
				<div class="flex flex-row items-center gap-4">
					<img
						src="/v2/assets/projects/trakt-tools/reversetv/logo.png"
						alt="Icons"
						class="h-14" />
					<div class="flex-col text-left">
						<h1 class="text-xl text-neutral-800">ReverseTV</h1>
						<p>
							Discover other roles that each actor in a movie or series has had
							in other productions based on your Trakt history.
						</p>
					</div>
				</div>
			</a>
			<a
				href="https://greasyfork.org/pt-BR/scripts/513086-old-trakt-brand"
				target="_blank"
				class="block w-full cursor-pointer rounded-lg border border-neutral-400 bg-neutral-100 p-4 text-center text-neutral-700">
				<div class="flex flex-row items-center gap-4">
					<img
						src="/v2/assets/projects/trakt-tools/rebrandtv/logo.png"
						alt="Icons"
						class="h-14" />
					<div class="flex-col text-left">
						<h1 class="text-xl text-neutral-800">RebrandTV</h1>
						<p>A script to return to the real old logo of Trakt!</p>
					</div>
				</div>
			</a>
		</div>
	</body>
</html>

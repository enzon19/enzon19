<!doctype html>
<html lang="pt-BR" class="scroll-smooth">
	<head>
		<meta charset="UTF-8" />
		<script
			defer
			src="https://unpkg.com/i18next@26.4.2/dist/umd/i18next.min.js"></script>
		<script defer src="/js/translation.js"></script>
		<meta http-equiv="X-UA-Compatible" content="IE=edge" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />

		<title data-i18n="donate.metaTitle">Doe para o enzon19</title>
		<meta
			data-i18n-content="donate.metaTitle"
			name="title"
			content="Doe para o enzon19" />
		<meta
			data-i18n-content="donate.metaDescription"
			name="description"
			content="Sou um desenvolvedor independente com muitos projetos legais!" />

		<link rel="icon" type="image/x-icon" href="/assets/favicon/favicon.ico" />
		<link
			rel="apple-touch-icon"
			sizes="180x180"
			href="/assets/favicon/apple-touch-icon.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="32x32"
			href="/assets/favicon/favicon-32x32.png" />
		<link
			rel="icon"
			type="image/png"
			sizes="16x16"
			href="/assets/favicon/favicon-16x16.png" />
		<link rel="manifest" href="/assets/favicon/site.webmanifest" />

		<link href="/css/style.css" rel="stylesheet" />
	</head>
	<body
		class="flex min-h-screen flex-col items-center justify-center bg-neutral-200 text-neutral-800 selection:bg-enzo-sky selection:text-white dark:bg-neutral-900 dark:text-neutral-300"
		id="main">
		<div class="flex flex-col items-center gap-1 text-center">
			<div class="flex flex-col items-center">
				<a href="https://enzon19.com"
					><img
						data-i18n-alt="common.siteName"
						src="/assets/face/love.png"
						alt="enzon19"
						class="h-20"
				/></a>
				<h1
					data-i18n="donate.title"
					class="text-4xl font-extrabold text-neutral-800 dark:text-white">
					Doe
				</h1>
			</div>
		</div>
		<div class="grid w-full max-w-4xl grid-cols-1 gap-4 p-4 sm:grid-cols-3">
			<a
				class="flex cursor-pointer flex-col items-center justify-center gap-4 rounded-3xl bg-neutral-100 px-10 py-6 text-center shadow-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-xl dark:bg-neutral-800"
				href="https://buymeacoffee.com/enzon19"
				target="_blank">
				<img
					data-i18n-alt="donate.buyMeACoffee"
					src="/assets/donate/bmac.png"
					alt="Buy Me a Coffee"
					class="h-12" />
				<div>
					<h3 data-i18n="donate.buyMeACoffee" class="text-lg font-bold">
						Buy Me a Coffee
					</h3>
				</div>
			</a>
			<a
				class="flex cursor-pointer flex-col items-center justify-center gap-4 rounded-3xl bg-neutral-100 px-10 py-6 text-center shadow-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-xl dark:bg-neutral-800"
				href="https://ko-fi.com/enzon19"
				target="_blank">
				<img
					data-i18n-alt="donate.koFi"
					src="/assets/donate/kofi.png"
					alt="Ko-Fi"
					class="h-12" />
				<div>
					<h3 data-i18n="donate.koFi" class="text-lg font-bold">Ko-Fi</h3>
				</div>
			</a>
			<div
				class="flex cursor-pointer flex-col items-center justify-center gap-4 rounded-3xl bg-neutral-100 px-10 py-6 text-center shadow-lg transition-all duration-300 hover:scale-[1.02] hover:shadow-xl dark:bg-neutral-800"
				onclick="navigator.clipboard.writeText('enzonbarata@outlook.com')"
				target="_blank">
				<img
					data-i18n-alt="donate.koFi"
					src="/assets/donate/pix.png"
					alt="Ko-Fi"
					class="h-12" />
				<div>
					<h3 data-i18n="donate.pix" class="text-lg font-bold">PIX</h3>
					<span data-i18n="donate.pixKey">enzonbarata@outlook.com</span>
				</div>
			</div>
		</div>

		<script src="/js/themes.js"></script>
	</body>
</html>
